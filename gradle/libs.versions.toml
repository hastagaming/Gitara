[versions]
agp = "9.0.1"
kotlin = "2.2.10"
composeBom = "2025.06.01"
activityCompose = "1.10.1"
appcompat = "1.7.0"
material = "1.12.0"
fragment = "1.8.6"
recyclerview = "1.3.2"
annotation = "1.9.1"
vectordrawable = "1.2.0"
constraintlayout = "2.2.1"
lifecycleExtensions = "2.2.0"
lifecycleCompiler = "2.4.0"
timber = "4.5.1"
jsch = "0.2.0"
commonsIo = "2.5"
jgit = "3.7.1.201504261725-r"
universalImageLoader = "1.9.5"
securePreferences = "0.1.7"
conscrypt = "2.7.0"
bouncycastle = "1.70"
acra = "5.8.4"
stetho = "1.5.0"
junit = "4.12"
robolectric = "3.5"
robolectricShadows = "3.4-rc2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-vectordrawable = { module = "androidx.vectordrawable:vectordrawable", version.ref = "vectordrawable" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycleExtensions" }
androidx-lifecycle-compiler = { module = "androidx.lifecycle:lifecycle-compiler", version.ref = "lifecycleCompiler" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
universal-image-loader = { module = "com.nostra13.universalimageloader:universal-image-loader", version.ref = "universalImageLoader" }
secure-preferences = { module = "com.scottyab:secure-preferences-lib", version.ref = "securePreferences" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk15on", version.ref = "bouncycastle" }
acra-mail = { module = "ch.acra:acra-mail", version.ref = "acra" }
acra-dialog = { module = "ch.acra:acra-dialog", version.ref = "acra" }
stetho-core = { module = "com.facebook.stetho:stetho", version.ref = "stetho" }
stetho-timber = { module = "com.facebook.stetho:stetho-timber", version.ref = "stetho" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric-core = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-shadows-support = { module = "org.robolectric:shadows-support-v4", version.ref = "robolectricShadows" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }